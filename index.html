<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lämpösummalaskuri</title>

<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lämpösumma"><meta name="theme-color" content="#2e7d32">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial,sans-serif;margin:10px}#map{height:350px}canvas{max-height:650px}</style></head><body><h2>Lämpösummalaskuri</h2><input type="date" id="startDate"><div id="map"></div><div id="stats"></div><canvas id="chart"></canvas><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let lat=60.17,lon=24.94,ch;const map=L.map('map').setView([lat,lon],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let marker=L.marker([lat,lon]).addTo(map);function fmt(d){return d.toISOString().split('T')[0]}const d=new Date();d.setMonth(0);d.setDate(1);startDate.value=fmt(d);const crosshair={id:'crosshair',afterEvent(c,a){c._x=a.event.x;c._y=a.event.y;c.draw();},afterDraw(c){if(!c._x||!c._y)return;const ctx=c.ctx,ca=c.chartArea;ctx.save();ctx.strokeStyle='rgba(50,50,50,.35)';ctx.beginPath();ctx.moveTo(c._x,ca.top);ctx.lineTo(c._x,ca.bottom);ctx.moveTo(ca.left,c._y);ctx.lineTo(ca.right,c._y);ctx.stroke();ctx.restore();}};async function yearly(y,m,d,e){let r=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${y}-${m}-${d}&end_date=${e}&daily=temperature_2m_mean&timezone=auto`);let j=await r.json();return j.daily?.temperature_2m_mean||[]}function cum(a){let s=0,r=[];a.forEach(v=>{s+=Math.max(v-5,0);r.push(+s.toFixed(1));});return r;}async function calc(){const sd=new Date(startDate.value),y=new Date().getFullYear(),mm=String(sd.getMonth()+1).padStart(2,'0'),dd=String(sd.getDate()).padStart(2,'0');const today=new Date();const cur=cum(await yearly(y,mm,dd,fmt(today)));const fcj=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_mean&forecast_days=14&timezone=auto`)).json();let last=cur.at(-1)||0,fc=[];for(const t of (fcj.daily?.temperature_2m_mean||[])){last+=Math.max(t-5,0);fc.push(+last.toFixed(1));}const p1=cum(await yearly(y-1,mm,dd,fmt(new Date(y-1,sd.getMonth(),sd.getDate()+cur.length+13))));const p2=cum(await yearly(y-2,mm,dd,fmt(new Date(y-2,sd.getMonth(),sd.getDate()+cur.length+13))));let labels=[];for(let i=0;i<cur.length+14;i++){let dt=new Date(sd);dt.setDate(sd.getDate()+i);labels.push(dt.toLocaleDateString('fi-FI'));}if(ch)ch.destroy();ch=new Chart(document.getElementById('chart'),{type:'line',plugins:[crosshair],data:{labels,datasets:[{label:String(y),data:[...cur,...Array(14).fill(null)],borderColor:'green',pointRadius:0,pointHoverRadius:0},{label:'Ennuste',data:[...Array(cur.length-1).fill(null),cur.at(-1),...fc],borderColor:'green',borderDash:[6,4],pointRadius:0,pointHoverRadius:0},{label:String(y-1),data:p1,borderColor:'black',pointRadius:0,pointHoverRadius:0},{label:String(y-2),data:p2,borderColor:'gray',pointRadius:0,pointHoverRadius:0}]},options:{interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'top',labels:{usepointStule:true}},tooltip:{displayColors:true,callbacks:{title:i=>'Päivämäärä: '+i[0].label,label:c=>`${c.dataset.label}: ${c.parsed.y?.toFixed(1)} astepäivää`}}},scales:{x:{ticks:{maxTicksLimit:12}}}}});}navigator.geolocation?.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;marker.setLatLng([lat,lon]);map.setView([lat,lon],10);calc();});map.on('click',e=>{lat=e.latlng.lat;lon=e.latlng.lng;marker.setLatLng(e.latlng);calc();});startDate.onchange=calc;setTimeout(calc,500);</script></body></html>
