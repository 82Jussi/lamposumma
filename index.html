<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lämpösummalaskuri</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lämpösumma">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family:Arial,sans-serif;margin:10px;color:#202124}
    .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    #map{height:350px;border-radius:8px}
    #stats{margin:10px 0;padding:10px;background:#f3f7f3;border-radius:8px;line-height:1.45}
    #stats.error{background:#ffebee;color:#b71c1c}
    #stats.loading{color:#555}
    canvas{max-height:650px}
    label{font-weight:600}
    footer{margin-top:16px;padding-top:8px;border-top:1px solid #ddd;font-size:11px;color:#777;text-align:center}
    footer a{color:#777}
  </style>
</head>
<body>
  <h2>Lämpösummalaskuri</h2>
  <div class="controls">
    <label for="startDate">Aloituspäivä</label>
    <input type="date" id="startDate">
  </div>
  <div id="map"></div>
  <div id="stats" class="loading" role="status" aria-live="polite">Ladataan tietoja...</div>
  <canvas id="chart"></canvas>
  <footer>
    Säädata: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0) ·
    Kartta: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-tekijät
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let lat=60.17,lon=24.94,ch,requestId=0;
    const startDate=document.getElementById('startDate');
    const stats=document.getElementById('stats');
    const map=L.map('map').setView([lat,lon],7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    const marker=L.marker([lat,lon]).addTo(map);

    function fmt(date){
      const y=date.getFullYear();
      const m=String(date.getMonth()+1).padStart(2,'0');
      const d=String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    function addDays(date,days){
      const result=new Date(date);
      result.setDate(result.getDate()+days);
      return result;
    }
    function setStatus(message,type='loading'){
      stats.className=type;
      stats.textContent=message;
    }
    async function getJson(url){
      const response=await fetch(url);
      if(!response.ok) throw new Error(`Palvelin vastasi virheellä ${response.status}.`);
      const json=await response.json();
      if(json.error) throw new Error(json.reason||'Sääpalvelu palautti virheen.');
      return json;
    }
    async function yearly(start,end){
      if(end<start) return [];
      const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${fmt(start)}&end_date=${fmt(end)}&daily=temperature_2m_mean&timezone=auto`;
      const json=await getJson(url);
      return json.daily?.temperature_2m_mean||[];
    }
    function cumulative(values,initial=0){
      let sum=initial;
      return values.map(value=>{
        if(Number.isFinite(value)) sum+=Math.max(value-5,0);
        return +sum.toFixed(1);
      });
    }

    const now=new Date();
    startDate.value=`${now.getFullYear()}-01-01`;
    startDate.max=fmt(now);

    const crosshair={
      id:'crosshair',
      afterEvent(chart,args){
        const event=args.event;
        if(event.type==='mouseout'){
          chart._crosshair=null;
        }else if(Number.isFinite(event.x)&&Number.isFinite(event.y)){
          chart._crosshair={x:event.x,y:event.y};
        }
        args.changed=true;
      },
      afterDraw(chart){
        const p=chart._crosshair;
        if(!p)return;
        const area=chart.chartArea;
        if(p.x<area.left||p.x>area.right||p.y<area.top||p.y>area.bottom)return;
        const ctx=chart.ctx;
        ctx.save();
        ctx.strokeStyle='rgba(50,50,50,.35)';
        ctx.beginPath();
        ctx.moveTo(p.x,area.top);ctx.lineTo(p.x,area.bottom);
        ctx.moveTo(area.left,p.y);ctx.lineTo(area.right,p.y);
        ctx.stroke();ctx.restore();
      }
    };

    async function calc(){
      const myRequest=++requestId;
      setStatus('Ladataan sää- ja ennustetietoja...');
      try{
        if(!startDate.value) throw new Error('Valitse aloituspäivä.');
        const selected=new Date(`${startDate.value}T12:00:00`);
        const today=new Date(); today.setHours(12,0,0,0);
        const year=today.getFullYear();
        const start=new Date(year,selected.getMonth(),selected.getDate(),12);
        if(start>today) throw new Error('Aloituspäivä ei voi olla tulevaisuudessa.');

        const yesterday=addDays(today,-1);
        const forecastJson=await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_mean&forecast_days=14&timezone=auto`);
        const forecastTemps=forecastJson.daily?.temperature_2m_mean||[];
        if(!forecastTemps.length) throw new Error('Ennustetietoja ei saatu.');

        const historyTemps=await yearly(start,yesterday);
        const current=cumulative(historyTemps);
        const base=current.at(-1)||0;
        const forecast=cumulative(forecastTemps,base);
        const totalDays=historyTemps.length+forecastTemps.length;
        const endComparison=addDays(start,totalDays-1);
        const previousStart1=new Date(year-1,start.getMonth(),start.getDate(),12);
        const previousStart2=new Date(year-2,start.getMonth(),start.getDate(),12);
        const previousEnd1=new Date(year-1,endComparison.getMonth(),endComparison.getDate(),12);
        const previousEnd2=new Date(year-2,endComparison.getMonth(),endComparison.getDate(),12);
        const [previous1,previous2]=await Promise.all([
          yearly(previousStart1,previousEnd1).then(v=>cumulative(v)),
          yearly(previousStart2,previousEnd2).then(v=>cumulative(v))
        ]);
        if(myRequest!==requestId)return;

        const labels=[];
        for(let i=0;i<totalDays;i++) labels.push(addDays(start,i).toLocaleDateString('fi-FI'));
        const historyData=[...current,...Array(forecastTemps.length).fill(null)];
        const forecastData=[...Array(Math.max(historyTemps.length-1,0)).fill(null)];
        if(historyTemps.length) forecastData.push(base);
        forecastData.push(...forecast);
        while(forecastData.length<totalDays) forecastData.unshift(null);
        forecastData.length=totalDays;

        if(ch)ch.destroy();
        ch=new Chart(document.getElementById('chart'),{
          type:'line',plugins:[crosshair],data:{labels,datasets:[
            {label:String(year),data:historyData,borderColor:'green',pointRadius:0,pointHoverRadius:3},
            {label:'Ennuste',data:forecastData,borderColor:'green',borderDash:[6,4],pointRadius:0,pointHoverRadius:3},
            {label:String(year-1),data:previous1,borderColor:'black',pointRadius:0,pointHoverRadius:3},
            {label:String(year-2),data:previous2,borderColor:'gray',pointRadius:0,pointHoverRadius:3}
          ]},options:{
            responsive:true,
            interaction:{mode:'index',intersect:false},
            plugins:{
              legend:{display:true,position:'top',labels:{usePointStyle:true}},
              tooltip:{displayColors:true,callbacks:{
                title:items=>'Päivämäärä: '+items[0].label,
                label:context=>context.parsed.y==null?'':`${context.dataset.label}: ${context.parsed.y.toFixed(1)} astepäivää`
              }}
            },
            scales:{x:{ticks:{maxTicksLimit:12}},y:{beginAtZero:true,title:{display:true,text:'Astepäivää'}}}
          }
        });
        const forecastEnd=forecast.at(-1)||base;
        stats.className='';
        stats.innerHTML=`<strong>Sijainti:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}<br><strong>Lämpösumma eiliseen:</strong> ${base.toFixed(1)} astepäivää<br><strong>Ennuste 14 päivän päähän:</strong> ${forecastEnd.toFixed(1)} astepäivää`;
      }catch(error){
        if(myRequest!==requestId)return;
        console.error(error);
        setStatus(`Tietojen lataus epäonnistui: ${error.message} Tarkista verkkoyhteys ja yritä uudelleen.`,'error');
      }
    }

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        position=>{
          lat=position.coords.latitude;lon=position.coords.longitude;
          marker.setLatLng([lat,lon]);map.setView([lat,lon],10);calc();
        },
        ()=>{
          setStatus('Sijaintia ei saatu. Käytetään oletussijaintia, jonka voi vaihtaa karttaa napauttamalla.');
          calc();
        },
        {enableHighAccuracy:false,timeout:8000,maximumAge:300000}
      );
    }else{
      calc();
    }
    map.on('click',event=>{
      lat=event.latlng.lat;lon=event.latlng.lng;
      marker.setLatLng(event.latlng);calc();
    });
    startDate.addEventListener('change',calc);
  </script>
</body>
</html>
