<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lämpösummalaskuri</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lämpösumma">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#202124}
    html,body{overflow-x:hidden}
    header{background:#2e7d32;color:#fff;padding:12px;display:flex;justify-content:space-between;font-size:22px;font-weight:bold}
    .card{background:#fff;margin:10px;padding:10px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
    .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    label{font-weight:600;font-size:14px}
    /* 16px estää iPhonen automaattisen zoomauksen kenttää napautettaessa */
    input{padding:6px;font-size:16px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
    #map{height:300px;border-radius:8px}
    #stats{line-height:1.45}
    #stats.error{background:#ffcaca;color:#b71c1c}
    #stats.loading{color:#555}
    canvas{max-height:650px}
    .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-bottom:8px}
    .legend button{display:flex;align-items:center;gap:6px;background:none;border:none;padding:4px 6px;border-radius:6px;font:inherit;font-size:14px;color:#202124;cursor:pointer}
    .legend button:focus-visible{outline:2px solid #2e7d32}
    .legend button.off{opacity:.4;text-decoration:line-through}
    footer{margin:16px 10px 12px;padding-top:8px;border-top:1px solid #ddd;font-size:11px;color:#777;text-align:center}
    footer a{color:#777}
  </style>
</head>
<body>
  <header>
    <span>Lämpösumma</span>
  </header>
  <div class="card controls">
    <label for="startDate">Aloituspäivä</label>
    <input type="date" id="startDate">
  </div>
  <div class="card"><div id="map"></div></div>
  <div class="card"><div id="stats" class="loading" role="status" aria-live="polite">Ladataan tietoja...</div></div>
  <div class="card">
    <div id="legend" class="legend"></div>
    <canvas id="chart"></canvas>
  </div>
  <footer>
    Säädata: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0) ·
    Kartta: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-tekijät
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let lat=60.17,lon=24.94,ch,requestId=0;
    const startDate=document.getElementById('startDate');
    const stats=document.getElementById('stats');
    const map=L.map('map').setView([lat,lon],7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    const marker=L.marker([lat,lon]).addTo(map);

    function fmt(date){
      const y=date.getFullYear();
      const m=String(date.getMonth()+1).padStart(2,'0');
      const d=String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    function addDays(date,days){
      const result=new Date(date);
      result.setDate(result.getDate()+days);
      return result;
    }
    const SERIES_STYLE=[
      {color:'#2e7d32',width:3,dash:[],cap:'round'},          // kuluva vuosi
      {color:'#2e7d32',width:2.5,dash:[0.1,4],cap:'round'},     // ennuste: pyöreät pisteet, sama väri kuin kuluva vuosi
      {color:'#1565c0',width:3,dash:[],cap:'round'},          // edellinen vuosi
      {color:'#8e24aa',width:3,dash:[],cap:'round'}           // 2 vuotta sitten
    ];
    function renderLegend(chart){
      const box=document.getElementById('legend');
      box.innerHTML='';
      chart.data.datasets.forEach((ds,i)=>{
        const b=document.createElement('button');
        b.type='button';
        const visible=chart.isDatasetVisible(i);
        if(!visible)b.classList.add('off');
        b.setAttribute('aria-pressed',String(visible));
        const dash=(ds.borderDash||[]).join(' ');
        b.innerHTML=`<svg width="40" height="12" aria-hidden="true"><line x1="4" y1="6" x2="38" y2="6" stroke="${ds.borderColor}" stroke-width="${ds.borderWidth}" stroke-dasharray="${dash}" stroke-linejoin="round" stroke-linecap="${ds.borderCapStyle}"/></svg><span>${ds.label}</span>`;
        b.addEventListener('click',()=>{
          chart.setDatasetVisibility(i,!chart.isDatasetVisible(i));
          chart.update();
          renderLegend(chart);
        });
        box.appendChild(b);
      });
    }
    function setStatus(message,type='loading'){
      stats.className=type;
      stats.textContent=message;
    }
    async function getJson(url){
      const response=await fetch(url);
      if(!response.ok) throw new Error(`Palvelin vastasi virheellä ${response.status}.`);
      const json=await response.json();
      if(json.error) throw new Error(json.reason||'Sääpalvelu palautti virheen.');
      return json;
    }
    async function yearly(start,end){
      if(end<start) return [];
      const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${fmt(start)}&end_date=${fmt(end)}&daily=temperature_2m_mean&timezone=auto`;
      const json=await getJson(url);
      return json.daily?.temperature_2m_mean||[];
    }
    function cumulative(values,initial=0){
      let sum=initial;
      return values.map(value=>{
        if(Number.isFinite(value)) sum+=Math.max(value-5,0);
        return +sum.toFixed(1);
      });
    }

    const now=new Date();
    startDate.value=`${now.getFullYear()}-01-01`;
    startDate.max=fmt(now);

    const crosshair={
      id:'crosshair',
      afterEvent(chart,args){
        const event=args.event;
        if(event.type==='mouseout'){
          chart._crosshair=null;
        }else if(Number.isFinite(event.x)&&Number.isFinite(event.y)){
          chart._crosshair={x:event.x,y:event.y};
        }
        args.changed=true;
      },
      afterDraw(chart){
        const p=chart._crosshair;
        if(!p)return;
        const area=chart.chartArea;
        if(p.x<area.left||p.x>area.right||p.y<area.top||p.y>area.bottom)return;
        const ctx=chart.ctx;
        ctx.save();
        ctx.strokeStyle='rgba(50,50,50,.35)';ctx.lineWidth=1;ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(p.x,area.top);ctx.lineTo(p.x,area.bottom);
        ctx.moveTo(area.left,p.y);ctx.lineTo(area.right,p.y);
        ctx.stroke();ctx.restore();
      }
    };

    async function calc(){
      const myRequest=++requestId;
      setStatus('Ladataan sää- ja ennustetietoja...');
      try{
        if(!startDate.value) throw new Error('Valitse aloituspäivä.');
        const selected=new Date(`${startDate.value}T12:00:00`);
        const today=new Date(); today.setHours(12,0,0,0);
        const year=today.getFullYear();
        const start=new Date(year,selected.getMonth(),selected.getDate(),12);
        if(start>today) throw new Error('Aloituspäivä ei voi olla tulevaisuudessa.');

        const yesterday=addDays(today,-1);
        const forecastJson=await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_mean&forecast_days=14&timezone=auto`);
        const forecastTemps=forecastJson.daily?.temperature_2m_mean||[];
        if(!forecastTemps.length) throw new Error('Ennustetietoja ei saatu.');

        const historyTemps=await yearly(start,yesterday);
        const current=cumulative(historyTemps);
        const base=current.at(-1)||0;
        const forecast=cumulative(forecastTemps,base);
        const totalDays=historyTemps.length+forecastTemps.length;
        const endComparison=addDays(start,totalDays-1);
        const previousStart1=new Date(year-1,start.getMonth(),start.getDate(),12);
        const previousStart2=new Date(year-2,start.getMonth(),start.getDate(),12);
        const previousEnd1=new Date(year-1,endComparison.getMonth(),endComparison.getDate(),12);
        const previousEnd2=new Date(year-2,endComparison.getMonth(),endComparison.getDate(),12);
        const [previous1,previous2]=await Promise.all([
          yearly(previousStart1,previousEnd1).then(v=>cumulative(v)),
          yearly(previousStart2,previousEnd2).then(v=>cumulative(v))
        ]);
        if(myRequest!==requestId)return;

        const labels=[];
        for(let i=0;i<totalDays;i++) labels.push(addDays(start,i).toLocaleDateString('fi-FI'));
        const historyData=[...current,...Array(forecastTemps.length).fill(null)];
        const forecastData=[...Array(Math.max(historyTemps.length-1,0)).fill(null)];
        if(historyTemps.length) forecastData.push(base);
        forecastData.push(...forecast);
        while(forecastData.length<totalDays) forecastData.unshift(null);
        forecastData.length=totalDays;

        if(ch)ch.destroy();
        ch=new Chart(document.getElementById('chart'),{
          type:'line',plugins:[crosshair],data:{labels,datasets:[
            {label:String(year),data:historyData},
            {label:'Ennuste',data:forecastData},
            {label:String(year-1),data:previous1},
            {label:String(year-2),data:previous2}
          ].map((ds,i)=>({...ds,
            borderColor:SERIES_STYLE[i].color,
            backgroundColor:SERIES_STYLE[i].color,
            borderWidth:SERIES_STYLE[i].width,
            borderDash:SERIES_STYLE[i].dash,
            pointRadius:0,pointHoverRadius:3,
            cubicInterpolationMode:'monotone',
            borderJoinStyle:'round',
            borderCapStyle:SERIES_STYLE[i].cap,
            spanGaps:false
          }))
          },options:{
            responsive:true,
            interaction:{mode:'index',intersect:false},
            plugins:{
              legend:{display:false},
              tooltip:{displayColors:true,filter:item=>item.parsed.y!=null,callbacks:{
                title:items=>'Päivämäärä: '+items[0].label,
                label:context=>context.parsed.y==null?'':`${context.dataset.label}: ${context.parsed.y.toFixed(1)} astepäivää`
              }}
            },
            scales:{x:{ticks:{maxTicksLimit:12}},y:{beginAtZero:true,title:{display:true,text:'Astepäivää'}}}
          }
        });
        renderLegend(ch);
        const forecastEnd=forecast.at(-1)||base;
        stats.className='';
        stats.innerHTML=`<strong>Sijainti:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}<br><strong>Lämpösumma eiliseen:</strong> ${base.toFixed(1)} astepäivää<br><strong>Ennuste 14 päivän päähän:</strong> ${forecastEnd.toFixed(1)} astepäivää`;
      }catch(error){
        if(myRequest!==requestId)return;
        console.error(error);
        setStatus(`Tietojen lataus epäonnistui: ${error.message} Tarkista verkkoyhteys ja yritä uudelleen.`,'error');
      }
    }

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        position=>{
          lat=position.coords.latitude;lon=position.coords.longitude;
          marker.setLatLng([lat,lon]);map.setView([lat,lon],10);calc();
        },
        ()=>{
          setStatus('Sijaintia ei saatu. Käytetään oletussijaintia, jonka voi vaihtaa karttaa napauttamalla.');
          calc();
        },
        {enableHighAccuracy:false,timeout:8000,maximumAge:300000}
      );
    }else{
      calc();
    }
    map.on('click',event=>{
      lat=event.latlng.lat;lon=event.latlng.lng;
      marker.setLatLng(event.latlng);calc();
    });
    startDate.addEventListener('change',calc);
  </script>
</body>
</html>
